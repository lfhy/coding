# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: 'coding-system-prompt'

- id: tools
  name: 'coding-tools'

- id: subprocess
  name: 'coding-subprocess-local'

- id: bash
  name: 'coding-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: 'coding-shell-env'

- id: tasks
  name: 'coding-jobs-local'

- id: tool-jobs
  name: 'coding-tool-jobs'

- id: tool-pwsh
  name: 'coding-tool-pwsh'
