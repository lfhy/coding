# 适配器先替换外部 Chromium，再装载真实提供方；不替换浏览器服务或网络校验。
# Full access 与 never 保持免审批；提供方不配置目的地白名单。
- id: browser-adapter
  name: './tests/fixtures/browser-playwright-adapter.ts'

- id: browser
  name: '@deepseek-ai/dsh-browser-playwright'

- id: attachment
  name: '@deepseek-ai/dsh-attachment-local'

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: danger-full-access

- id: tool-browser
  name: '@deepseek-ai/dsh-tool-browser'

- id: replay
  name: '@deepseek-ai/dsh-llm-replay'

- id: agent
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()
    tools:
      mode: native
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: 'Use browser_use to inspect the requested page and report its observed title.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none
