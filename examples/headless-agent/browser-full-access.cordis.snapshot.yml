# 仅替换模型和浏览器页面边界；工具、审批、权限解析和 agent loop 使用真实插件。
# 本场景没有审批应答者，Full access 的两个部署默认值必须直接允许浏览器调用。
- id: browser-fixture
  name: './tests/fixtures/browser-full-access-provider.ts'

- id: attachment
  name: '@deepseek-ai/dsh-attachment-local'

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: danger-full-access

- id: tool-browser
  name: '@deepseek-ai/dsh-tool-browser'

- id: replay
  name: '@deepseek-ai/dsh-llm-replay'

- id: agent
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()
    tools:
      mode: native
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: 'Use browser_use to inspect the requested page and report its observed title.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none
