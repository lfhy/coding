name: Coding native clients

# 面向 macOS arm64 Electron 应用与 Linux amd64 CLI/TUI 的可选构建检查。
# 桌面包仅本机 ad-hoc 签名，未经公证；不发布、不调用真实 API。
on:
  workflow_dispatch:
  push:
    tags: ['coding-v*']

concurrency:
  group: coding-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  GO_VERSION: '1.25'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15-arm
          - target: linux-amd64
            os: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the SEA runtime
        if: matrix.target == 'linux-amd64'
        run: pnpm run build:runtime -- --target=${{ matrix.target }}

      - name: Build the TUI (linux)
        if: matrix.target == 'linux-amd64'
        run: pnpm run build:tui

      - name: Build the desktop app (macOS)
        if: matrix.target == 'darwin-arm64'
        run: pnpm run build:desktop
        env:
          CGO_ENABLED: '1'

      - name: Archive and checksum the macOS app
        if: matrix.target == 'darwin-arm64'
        shell: bash
        run: |
          test -d dist/Coding.app
          ditto -c -k --keepParent --norsrc --noextattr dist/Coding.app dist/Coding-darwin-arm64.zip
          shasum -a 256 dist/Coding-darwin-arm64.zip > dist/checksums.txt
          cat dist/checksums.txt

      - name: Checksum the Linux TUI
        if: matrix.target == 'linux-amd64'
        shell: bash
        run: |
          test -f dist/coding
          sha256sum dist/coding > dist/checksums.txt
          cat dist/checksums.txt
