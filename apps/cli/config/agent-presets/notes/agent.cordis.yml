# 笔记专用模式：独立复用标准模式的完整工具能力，不通过运行时继承标准 preset。
# 该文件保持自己的 entry roster，便于 preset 按名称独立挂载和恢复。

- id: persona
  name: 'coding-persona'
  config:
    text: |-
      你运行在 {{model}} 模型上，当前工作目录是 {{cwd}}。这是笔记专用模式：你要把笔记目录当作用户的知识空间，帮助用户读写、整理、改写和归纳笔记。

      # 笔记工作方式

      - 先理解用户要处理的笔记和目标，再选择最小必要的操作；涉及多个文件时先说明范围和组织方式。
      - 读取笔记时保留标题层级、列表、链接、代码和引用的含义；总结要区分事实、结论、待办和不确定内容，不凭空补写事实。
      - 修改或整理笔记时尽量保留用户原有语气与结构，只改变明确要求的部分；移动、合并或删除内容前先核对目标文件，避免丢失内容。
      - 新建笔记使用清晰、稳定、便于检索的标题和 Markdown 结构；除非用户要求，不批量改名、不改动无关文件。
      - 写入完成后核对文件内容和路径，向用户简要说明改了什么；失败时说明未完成的动作和下一步，不把计划说成已完成。
      - 用户要求代码或脚本时，可以使用完整工具链完成必要工作，但仍优先把结果整理成可继续维护的笔记内容。
      - 默认用简体中文交流；用户指定语言或要求保留原文时遵从用户要求。

- id: agent-instructions
  name: 'coding-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-bash
  name: 'coding-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: 'coding-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: 'coding-tool-fs'

- id: tool-apply-patch
  name: 'coding-tool-apply-patch'

- id: tool-fs-search
  name: 'coding-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: 'coding-tool-jobs'

- id: skill-filesystem
  name: 'coding-skill-filesystem'

- id: skill-browser-use
  name: 'coding-skill-browser-use'

- id: skill-stylekit
  name: 'coding-skill-stylekit'

- id: skill-frontend-development
  name: 'coding-skill-frontend-development'

- id: skill-project-init
  name: 'coding-skill-project-init'

- id: skill-go-backend
  name: 'coding-skill-go-backend'

- id: tool-skill
  name: 'coding-tool-skill'
  config:
    turnReminder: true

- id: tool-goal
  name: 'coding-tool-goal'

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: 'coding-plan-mode'
      config:
        section: |
          You are in plan mode. Stay in plan mode until the user switches the session mode. Explore first with non-mutating reads and make the plan decision-complete before implementing it.

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: 'coding-compaction-basic'
    - id: command-compact
      name: 'coding-command-compact'
    - id: tool-context-compact
      name: 'coding-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: 'coding-tool-subagent-control'
    - id: tool-subagent-list-agents
      name: 'coding-tool-subagent-control/list-agents'
    - id: tool-subagent
      name: 'coding-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable
    - id: tool-subagent-fork
      name: 'coding-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable
    - id: workflow-worker-thread
      name: 'coding-workflow-worker-thread'
      config:
        provider: spawn
    - id: tool-workflow
      name: 'coding-tool-workflow'
    - id: tool-ralph
      name: 'coding-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

- id: tool-ask-user
  name: 'coding-tool-ask-user'

- id: tool-todo
  name: 'coding-tool-todo'
  config:
    allowParallelInProgress: true

- id: progress-reminder
  name: 'coding-progress-reminder'
  config:
    toolCallsPerReminder: 40

- id: tool-web
  name: 'coding-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

- id: tool-browser
  name: 'coding-tool-browser-ego'

- id: tool-image-gen
  name: 'coding-tool-image-gen'

- id: tool-presentation
  name: 'coding-agent-tool-presentation'
  config:
    mode: both
