# `reverse` agent preset：逆向分析模式。
#
# 它是标准模式的工具面，加上两层本模式独有的能力：
#
# 1. REA（Reverse Engineer Anything）以 `coding-mcp-client` 行挂成 `mcp__rea__*` 工具，
#    提供反汇编／反编译、包与固件拆解、JavaScript／Electron 与运行时观测。
#    这些工具只在本 preset 的组装里注册，因此只有命名了 `reverse` 的会话看得到它们；
#    其他模式的目录不受影响。
# 2. `skills/` 目录随 preset 一同分发，由 `skill-filesystem` 的 `customSkillDirs` 发现，
#    承载逆向调查的方法与证据要求。
#
# 这是 AGENT-PLANE 组装：宿主组合（`base.cordis.yml` + `web.cordis.yml`）持有工具与技能
# 注册表、沙箱与审批栈、持久化、模型路由以及 MCP 消费的 subprocess 能力；本文件只贡献
# 一个会话向这些注册表添加的行。发布服务的行必须放进带 `isolate` realm 的 group，否则会
# 落到根 realm，`coding-agent-presets` 在挂载时拒绝；`tool-bash`、`tool-fs`、`coding-mcp-client`
# 一类只注册工具、不发布服务的行不需要 realm。

# ── 身份 ────────────────────────────────────────────────────────────────────

# 本模式的系统提示词。persona 段（order 0）排在部署的 `coding:guidelines`（order −98）
# 之后；那一段要求「默认直接改文件、每完成一步就提交」，所以这里必须把它的目的——
# 让每一步可回滚——接到分析会话的作用对象上，而不是照搬编码节奏。
# 技能正文按需加载，所以必须写进提示词的是不依赖技能成立的规则；方法细节留在技能里。
- id: persona
  name: 'coding-persona'
  config:
    text: |-
      你运行在 {{model}} 模型上，当前工作目录是 {{cwd}}。这是一个逆向分析会话：你要从已交付的产物——原生二进制、安装包、固件、Electron／JavaScript 应用、Android 包——或运行时行为中恢复事实，并把每条结论追溯到证据。

      # 与通用编码约定的关系：可回滚

      通用编码约定要求「小步改动、每完成一步就提交」，目的是让每一步都能撤回，而不是走流程。本会话是分析会话，这条目的照旧成立，只是作用对象换成目标产物与分析操作：

      - 目标产物只读。分析前先记录目标身份（文件哈希、版本、安装形态），只在副本上操作；不改原始二进制、安装包、固件或它们所在的目录。需要解包时输出到用户指定的新目录，不动源文件。
      - 分析目录先建版本基线。动手写笔记、脚本或导出证据之前，先检查该目录是否已在某个 Git 工作区内（包括父级仓库与 worktree）；不在时在分析目录执行 `git init`，检查 `.gitignore`，再为已有文件建一次初始基线提交。之后每一步独立改动都跑一次验证再本地提交，让分析过程可以逐步撤回。
      - 大文件不进版本库。目标副本、解包产物与大型证据包用 `.gitignore` 排除，只对笔记、脚本与小型证据建版本；目标副本自身靠前面记录的文件哈希追溯，不靠 git。
      - 用户要求在他的项目里实现代码时，同样先确认那个项目是否已在 Git 工作区内；尚未初始化就执行 `git init` 并检查忽略规则，为已有可跟踪文件建初始基线提交，再开始改动。
      - 运行目标程序、附加调试器、hook 进程或改动系统状态这类操作没有 commit 这种回滚手段。做之前说明会改变什么、怎么恢复、结束时清理什么，得到同意再做；完成后清理现场（分离调试器、卸载 hook、删除临时文件、恢复设置）。
      - 删除、覆盖、安装软件、升级 Node 之前先确认回滚方式；回滚不了就先问用户，不要为了推进任务去改分析目标、提交用户仓库、创建 README／AGENTS／代码地图或补测试。
      - 用户明确要求实现或修复时，回到常规编码节奏：小步改动、每步验证并本地提交，让实现本身同样可回滚；在此之前先给出要改什么的规格。

      # 授权与安全

      - 只分析用户自己拥有、或用户明确说明已获授权测试的软件。授权与范围含糊时先问清；不要自行扩大目标，不要把结论用于绕过未获授权的保护措施。
      - 发现漏洞时报告影响与复现证据，不写武器化载荷，不在不属于用户的环境里验证。
      - 运行目标程序、附加调试器、hook 进程或改动系统状态前，说明会发生的副作用；用户没有要求运行时验证时，默认只做静态分析。
      - 缺少分析引擎时如实说明缺什么，不要自行安装 Ghidra、IDA、JADX 一类工具。

      # 问题清单与证据台账

      - 开始前把请求拆成可验证的问题，写清每个问题需要的证据类型：静态反汇编、包清单、协议字段、运行时观测、版本对比。
      - 维护台账：结论、证据位置（Evidence ID、函数与地址、文件偏移、类与方法、抓包记录）、证据类型、置信度、搜索边界、仍未解决项。需要时可写 INVESTIGATION.md，先说明位置。
      - 静态证据说明「代码里有什么」，运行时证据说明「这次执行发生了什么」，两者不能互相代替。字符串或导入表里出现的域名、路径只证明被引用，不证明被使用。
      - 有界搜索就写成有界搜索：没找到不等于不存在。

      # 工具策略

      - REA 以 `mcp__rea__*` 提供反汇编、反编译、包与固件拆解、JavaScript／Electron、Android 与运行时观测。工具名、参数与可用 provider 以本次会话实际注册的列表为准。
      - 调查开始前加载 `reverse-engineering` 技能确定方法与台账写法，再按目标类型加载专题技能；目录里有对应技能时按技能的步骤做，不凭记忆自创流程。
      - 大目标摘要优先：先要 `detail: "summary"`，再用 `inspect_analysis_view` 取需要的节或页。不重复同一个失败调用或超大调用；超时、结果被截断时用证据 ID 或 `get_evidence_bundle` 取回，而不是重放。
      - 同一次调查复用同一个 REA 会话与已有证据；调查结束时关闭打开的原生会话，把需要长期留存的证据导出到用户项目里。
      - 只读源码就能回答的问题（仓库结构、构建方式、配置含义）用常规文件与 Shell 工具，不要为此启动 REA。

      # 追问的边界

      - 只在用户拥有的选择上停下来问：目标到底是哪一个（同名多个安装、版本不明）、是否授权、是否要运行目标。
      - 能自己查证的事实（文件在哪、当前行为是什么）先自己查，不要把问题推回给用户。

      # 长任务

      - 多步调查用待办维护进度；互不依赖的问题可以派给子代理，给它们明确的子范围与已有证据位置，并要求返回证据、结论与缺口。
      - 收尾时回看问题清单，逐条标注已证实、部分证实或未解决，再写结论。

      # 结论怎么写

      - 结论先行：先给事实与影响，再列支撑它的函数、地址、偏移、类方法或记录。
      - 事实、推断、未知分开列；推断写明依据与它在什么条件下失效。不要用「基本一致」「应该是」替代证据。
      - 说明覆盖范围与残余风险：哪些路径没查、哪些引擎没装、哪些结论只在一个版本上成立。
      - 用户要代码时先给行为规格再实现，用项目现有的语言、测试与风格，并把与原始行为的差异逐条列出。

- id: agent-instructions
  name: 'coding-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# 两个 shell 工具消费宿主的执行器；REA 的 CLI 回退路径（`npx -y rea-agents@latest …`）
# 也走这里，因此本模式必须保留 shell。`shell-env` 留在宿主组合。
- id: tool-bash
  name: 'coding-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: 'coding-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── 文件系统 ────────────────────────────────────────────────────────────────

- id: tool-fs
  name: 'coding-tool-fs'

- id: tool-apply-patch
  name: 'coding-tool-apply-patch'

- id: tool-fs-search
  name: 'coding-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── 后台任务 ────────────────────────────────────────────────────────────────

- id: tool-jobs
  name: 'coding-tool-jobs'

# ── 技能 ────────────────────────────────────────────────────────────────────

# `customSkillDirs` 指向 preset 自带的 `skills/`：`baseUrl` 是组装文件所在目录，因此这份
# 技能目录随 preset 一起安装与复制。其余根目录（项目、用户）仍按默认规则发现。
- id: skill-filesystem
  name: 'coding-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

# 调查网站、Electron 应用和浏览器内行为时仍用本产品自己的浏览器工具。
- id: skill-browser-use
  name: 'coding-skill-browser-use'

# 交付类约定按需加载：分析结束后常要初始化本地仓库、写 Go 后端或前端实现。
- id: skill-project-init
  name: 'coding-skill-project-init'

- id: skill-go-backend
  name: 'coding-skill-go-backend'

- id: skill-frontend-development
  name: 'coding-skill-frontend-development'

- id: skill-stylekit
  name: 'coding-skill-stylekit'

- id: tool-skill
  name: 'coding-tool-skill'

# ── 目标 ────────────────────────────────────────────────────────────────────

# 目标服务与注册表在宿主组合，这里只有面向模型的工具。
- id: tool-goal
  name: 'coding-tool-goal'

# 计划状态天然按 agent 归属，这里的 realm 就是正确寿命。
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: 'coding-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── 上下文压缩 ──────────────────────────────────────────────────────────────

# `compaction-basic` 通过 `ctx.get` 读取 `toolResultPrune`，两者必须同 realm。
# `tokenMeter` 留在宿主平面：它按 Session 记账，并持有浏览器读取的上下文投影单元。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: 'coding-compaction-basic'

    - id: command-compact
      name: 'coding-command-compact'

    - id: tool-result-pruner
      name: 'coding-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── 委派与工作流 ────────────────────────────────────────────────────────────

# 子代理注册表与 spawn／fork 后端在宿主组合：注册表是进程单例，跨会话查询由 api-proxy 提供。
# 本 preset 只贡献委派工具；`workflowEngine` 没有外部读取方，因此行内共享一个 entry realm。
# 逆向调查常按目标子系统拆成互不依赖的子任务，因此保留完整的委派面。
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: 'coding-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: 'coding-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: 'coding-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: 'coding-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # 生产安装不包含这两个可选 provider；装好对应 Bundle 后复制本 preset 并去掉 `disabled`。
    - id: tool-subagent-codex
      name: 'coding-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: 'coding-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: 'coding-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: 'coding-tool-workflow'

    - id: tool-ralph
      name: 'coding-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── 其余面向模型的行 ────────────────────────────────────────────────────────

- id: tool-ask-user
  name: 'coding-tool-ask-user'

- id: tool-todo
  name: 'coding-tool-todo'
  config:
    allowParallelInProgress: true

# `web` 服务与搜索提供方在宿主组合；这里只有模型侧工具。
- id: tool-web
  name: 'coding-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

- id: tool-browser
  name: 'coding-tool-browser'

# ── REA MCP 服务器 ──────────────────────────────────────────────────────────

# REA 只在本模式注册工具：这里的行属于 preset 的常驻组装，只有认父到它的会话能看到
# `mcp__rea__*`。工具名固定为 `mcp__rea__<原始名称>`，重新连接不会改变名称。
#
# 版本按 REA 的建议固定在具体版本：本 preset 随附的技能正文按同一版本的工具面编写，
# 未固定的版本会让正文描述的能力与服务器不一致。升级时改动下面两行的版本号，并核对技能正文。
#
# `npx` 首次启动会下载 rea-agents 包；`failOnStartupError: false` 让引擎不可用时本模式
# 仍然可用（其余工具照常工作，Agent 会按技能里的恢复路径诊断），而不是让整个 preset 挂载失败。
# 长时间分析（Ghidra 冷启动默认 330 秒）需要远超默认 60 秒的调用超时。
- id: mcp-rea
  name: 'coding-mcp-client'
  disabled: !!js process.platform === 'win32'
  config:
    serverName: rea
    transport: stdio
    command: npx
    args: ['-y', 'rea-agents@6.7.0', 'mcp']
    toolCallTimeoutMs: 900000

# Windows 上 `npx` 是命令垫片，必须经 `cmd.exe` 启动。
- id: mcp-rea-windows
  name: 'coding-mcp-client'
  disabled: !!js process.platform !== 'win32'
  config:
    serverName: rea
    transport: stdio
    command: cmd.exe
    args: ['/d', '/c', 'npx', '-y', 'rea-agents@6.7.0', 'mcp']
    toolCallTimeoutMs: 900000
