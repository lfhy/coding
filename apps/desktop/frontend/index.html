<!doctype html>
<html><head><meta charset="utf-8"><title>Coding</title>
<style>
/* 跟随系统外观：背景用 macOS 窗口底色变量，与目标页面的亮/暗一致。 */
html,body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){html,body{background:#0b0d10;color:#e6e8ea}}
.box{display:flex;flex-direction:column;align-items:center;gap:18px}
.logo{width:84px;height:84px;border-radius:20px;overflow:hidden}
.logo img,.logo svg{width:100%;height:100%;display:block}
.spinner{width:26px;height:26px;border:3px solid rgba(128,128,128,.25);border-top-color:#7a5cf0;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{font-size:13px;opacity:.65}
.bar{width:220px;height:6px;border-radius:3px;background:rgba(128,128,128,.25);overflow:hidden;display:none}
.bar .fill{height:100%;width:0;border-radius:3px;background:#7a5cf0;transition:width .2s ease}
</style></head>
<body><div class="box">
<div class="logo"><img src="logo.png" alt="Coding"></div>
<div class="spinner"></div>
<div class="msg">正在准备 Coding</div>
<div class="bar"><div class="fill"></div></div>
</div>
<script>
const goTo = (ep) => {
  if (!ep) return false
  window.location.replace(ep)
  return true
}
const poll = async () => {
  const go = window.go && window.go.main && window.go.main.App
  if (!go || typeof go.Endpoint !== 'function') {
    setTimeout(poll, 200)
    return
  }
  try {
    if (goTo(await go.Endpoint())) return
  } catch (err) {
    console.error('Coding host probe failed', err)
  }
  setTimeout(poll, 400)
}
if (window.runtime && typeof window.runtime.EventsOn === 'function') {
  window.runtime.EventsOn('coding:host-ready', goTo)
  window.runtime.EventsOn('coding:host-progress', ({ done, total }) => {
    if (!Number.isFinite(total) || total <= 0) return
    const pct = Math.max(0, Math.min(100, Math.round((done / total) * 100)))
    const bar = document.querySelector('.bar')
    bar.style.display = 'block'
    bar.querySelector('.fill').style.width = pct + '%'
    document.querySelector('.msg').textContent = `正在准备 Coding ${pct}%`
  })
  window.runtime.EventsOn('coding:host-error', (msg) => {
    document.querySelector('.msg').textContent = '启动失败: ' + msg
    document.querySelector('.spinner').style.display = 'none'
  })
}
poll()
</script>
</body></html>
