<!doctype html>
<html><head><meta charset="utf-8"><title>Coding</title>
<style>
/* 复刻 DSH BootPage（packages/client/web/src/boot-page.module.css），
   使壳层启动页与 Host 就绪后的插件加载页视觉完全一致，消除二次加载跳变。 */
html,body{margin:0;height:100%}
.boot{--dsh-boot-bg:#fff;--dsh-boot-label-primary:#0f1115;--dsh-boot-label-secondary:#61666b;
  --dsh-boot-label-tertiary:#81858c;--dsh-boot-border:rgb(0 0 0 / 10%);--dsh-boot-brand:#0f1115;
  height:100%;display:grid;place-items:center;background:var(--dsh-boot-bg)}
@media (prefers-color-scheme: dark){.boot{--dsh-boot-bg:#151517;--dsh-boot-label-primary:#f9fafb;
  --dsh-boot-label-secondary:#cfd3d6;--dsh-boot-label-tertiary:#adb2b8;
  --dsh-boot-border:rgb(255 255 255 / 12%);--dsh-boot-brand:#f9fafb}}
.card{display:flex;flex-direction:column;align-items:center;gap:16px}
.wordmark{font-size:16px;line-height:24px;font-weight:600;letter-spacing:.08em;
  color:var(--dsh-boot-label-primary)}
.spinner{position:relative;width:20px;height:20px;border-radius:50%;
  border:2px solid var(--dsh-boot-border);animation:spin .8s linear infinite}
.spinner::after{content:'';position:absolute;inset:-2px;border-radius:inherit;
  background:conic-gradient(var(--dsh-boot-brand) var(--dsh-boot-arc,72deg),transparent 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 0);
  mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 0)}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-size:12px;line-height:18px;color:var(--dsh-boot-label-tertiary)}
.failed{max-width:480px;display:flex;flex-direction:column;gap:8px}
.failedTitle{font-size:14px;line-height:22px;font-weight:600;color:var(--dsh-boot-label-primary)}
.failedItem{font-family:'SF Mono','JetBrains Mono','Fira Code',Consolas,Menlo,'PingFang SC';
  font-size:12px;line-height:18px;color:var(--dsh-boot-label-secondary);white-space:pre-wrap}
</style></head>
<body><div class="boot" data-dsh-boot="">
<div class="card" data-dsh-boot-card="">
<div class="wordmark">HARNESS</div>
<div class="spinner" data-dsh-boot-spinner=""></div>
<div class="hint">正在准备 Coding</div>
</div>
</div>
<script>
const card = document.querySelector('[data-dsh-boot-card]')
const spinner = document.querySelector('[data-dsh-boot-spinner]')
const wordmark = document.querySelector('.wordmark')
const hint = document.querySelector('.hint')
const div = (className, text) => {
  const el = document.createElement('div')
  el.className = className
  el.textContent = text
  return el
}
const goTo = (ep) => {
  if (!ep) return false
  window.location.replace(ep)
  return true
}
const poll = async () => {
  const go = window.go && window.go.main && window.go.main.App
  if (!go || typeof go.Endpoint !== 'function') {
    setTimeout(poll, 200)
    return
  }
  try {
    if (goTo(await go.Endpoint())) return
  } catch (err) {
    console.error('Coding host probe failed', err)
  }
  setTimeout(poll, 400)
}
if (window.runtime && typeof window.runtime.EventsOn === 'function') {
  window.runtime.EventsOn('coding:host-ready', goTo)
  window.runtime.EventsOn('coding:host-progress', ({ done, total }) => {
    if (!Number.isFinite(total) || total <= 0) return
    const ratio = Math.max(0, Math.min(1, done / total))
    // 物化条目过半后剩余阶段无事件，直接收敛到 100%，避免停在半程百分比。
    const pct = ratio >= 0.5 ? 100 : Math.round(ratio * 100)
    spinner.style.setProperty('--dsh-boot-arc', `${Math.round(72 + (pct / 100) * 216)}deg`)
    hint.textContent = `正在准备 Coding ${pct}%`
  })
  window.runtime.EventsOn('coding:host-error', (msg) => {
    const report = div('failed')
    report.append(div('failedTitle', '插件加载失败'))
    report.append(div('failedItem', String(msg)))
    card.replaceChildren(wordmark, report)
  })
}
poll()
</script>
</body></html>
